name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Same Xcode (Swift 6.2) as the local toolchain; the runner default can be newer.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode not found at $DEVELOPER_DIR"; ls -d /Applications/Xcode*.app; exit 1; }
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
